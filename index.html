<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia House Locator - Live Real-Time Sync</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Header Bar */
        header {
            background: #003366;
            color: white;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sync-badge {
            background: #28a745;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Floating Sidebar / Panel */
        #main-panel {
            position: absolute;
            top: 65px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 330px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        /* Sync ID Control Box */
        .sync-box {
            background: #f0f7ff;
            border: 1px solid #cce5ff;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .sync-box label {
            font-size: 0.75rem;
            color: #003366;
            font-weight: bold;
        }

        .sync-box input {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #99ccff;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Tabs UI */
        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            background: none;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #003366;
            border-bottom-color: #003366;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        button.btn-primary {
            background: #003366;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Search Results & Favorites List */
        .list-container {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            border-top: 1px solid #eee;
        }

        .list-container li {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 0.85rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-container li:hover {
            background-color: #f0f7ff;
        }

        .fav-info {
            flex: 1;
            overflow: hidden;
            padding-right: 8px;
        }

        .fav-title {
            font-weight: bold;
            color: #003366;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fav-desc {
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
        }

        .btn-share {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 9px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        /* Selected Location Action Panel */
        #info-panel {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        #info-panel h3 {
            font-size: 0.95rem;
            color: #003366;
            margin-bottom: 4px;
        }

        #info-panel p {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .btn-save-fav {
            width: 100%;
            background: #ff9900;
            color: white;
            border: none;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
        }

        .btn-waze { background-color: #33ccff; color: #000; }
        .btn-gmaps { background-color: #4285F4; }

        .star-marker-icon {
            font-size: 26px;
            line-height: 26px;
            text-align: center;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
            cursor: pointer;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 480px) {
            #main-panel {
                top: 60px;
                left: 10px;
                right: 10px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏠 Malaysia House Locator</h1>
        <div class="sync-badge" id="status-indicator">🟢 Cloud Sync Active</div>
    </header>

    <div id="main-panel">
        <!-- Live Sync Group Input -->
        <div class="sync-box">
            <label>Sync ID:</label>
            <input type="text" id="sync-id-input" value="SABAH-KL-HOUSES" onchange="changeSyncGroup(this.value)" />
            <button class="btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="changeSyncGroup(document.getElementById('sync-id-input').value)">Join</button>
        </div>

        <!-- Tab Controls -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('search')">🔍 Search</button>
            <button class="tab-btn" onclick="switchTab('favorites')">⭐ Live Stars (<span id="fav-count">0</span>)</button>
        </div>

        <!-- Tab 1: Search -->
        <div id="tab-search" class="tab-content active">
            <div class="search-box">
                <input type="text" id="address-input" style="flex:1;" placeholder="Search address, city, postcode..." />
                <button class="btn-primary" onclick="searchLocation()">Search</button>
            </div>
            <ul id="results-list" class="list-container"></ul>
        </div>

        <!-- Tab 2: Favorites Library -->
        <div id="tab-favorites" class="tab-content">
            <button class="btn-share" onclick="shareLiveSyncLink()">🔗 Copy Sync Link for Other Devices</button>
            <ul id="favorites-list" class="list-container" style="max-height: 200px;"></ul>
        </div>

        <!-- Selected Location & Nav Actions -->
        <div id="info-panel">
            <h3 id="loc-title">Selected Location</h3>
            <p id="loc-address">Address details will appear here.</p>
            
            <button class="btn-save-fav" onclick="saveCurrentToFavorites()">⭐ Save & Sync To All Devices</button>

            <div class="nav-buttons">
                <a id="btn-gmaps" class="nav-btn btn-gmaps" target="_blank">Google Maps</a>
                <a id="btn-waze" class="nav-btn btn-waze" target="_blank">Waze</a>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Public Cloud Storage Bucket ID
        const CLOUD_BUCKET = "3a8K9b2C1xL7zP9Q"; 

        // Initialize Map over Malaysia
        const map = L.map('map').setView([4.2105, 108.9758], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let searchMarker = null;
        let activeSelectedData = null; 
        let favoriteMarkersOnMap = [];
        let favorites = [];
        let currentSyncId = "SABAH-KL-HOUSES";

        const starIcon = L.divIcon({
            className: 'star-marker-icon',
            html: '⭐',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        // 1. Read Sync ID from URL hash if opening shared link
        const hashMatch = window.location.hash.match(/sync=([A-Za-z0-9_-]+)/);
        if (hashMatch && hashMatch[1]) {
            currentSyncId = hashMatch[1].toUpperCase();
        }
        document.getElementById('sync-id-input').value = currentSyncId;

        // 2. Fetch Initial Cloud Data & Start Background Sync Poller
        syncFromCloud();
        setInterval(syncFromCloud, 3000); // Checks for changes every 3 seconds!

        // Change Sync ID Group
        function changeSyncGroup(newSyncId) {
            if (!newSyncId.trim()) return;
            currentSyncId = newSyncId.trim().toUpperCase();
            document.getElementById('sync-id-input').value = currentSyncId;
            window.location.hash = `sync=${currentSyncId}`;
            syncFromCloud();
            alert(`Connected to Sync Group: "${currentSyncId}"`);
        }

        // Push Favorites to Cloud Storage
        async function pushToCloud() {
            try {
                document.getElementById('status-indicator').innerText = '⏳ Syncing...';
                await fetch(`https://kvdb.io/${CLOUD_BUCKET}/${currentSyncId}`, {
                    method: 'POST',
                    body: JSON.stringify(favorites)
                });
                document.getElementById('status-indicator').innerText = '🟢 Cloud Sync Active';
            } catch (err) {
                console.error("Cloud Push Error:", err);
            }
        }

        // Fetch Favorites from Cloud Storage
        async function syncFromCloud() {
            try {
                const res = await fetch(`https://kvdb.io/${CLOUD_BUCKET}/${currentSyncId}`);
                if (res.ok) {
                    const cloudData = await res.json();
                    if (Array.isArray(cloudData)) {
                        // Only update if cloud data has changed
                        if (JSON.stringify(cloudData) !== JSON.stringify(favorites)) {
                            favorites = cloudData;
                            renderFavorites();
                        }
                    }
                }
            } catch (err) {
                // Key doesn't exist yet in cloud
            }
        }

        function switchTab(tabName) {
