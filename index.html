<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia House Locator - Live Real-Time Sync</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Header Bar */
        header {
            background: #003366;
            color: white;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sync-badge {
            background: #28a745;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Floating Sidebar / Panel */
        #main-panel {
            position: absolute;
            top: 65px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 330px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        /* Sync ID Control Box */
        .sync-box {
            background: #f0f7ff;
            border: 1px solid #cce5ff;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .sync-box label {
            font-size: 0.75rem;
            color: #003366;
            font-weight: bold;
        }

        .sync-box input {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #99ccff;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Tabs UI */
        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            background: none;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #003366;
            border-bottom-color: #003366;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        button.btn-primary {
            background: #003366;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Search Results & Favorites List */
        .list-container {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            border-top: 1px solid #eee;
        }

        .list-container li {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 0.85rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-container li:hover {
            background-color: #f0f7ff;
        }

        .fav-info {
            flex: 1;
            overflow: hidden;
            padding-right: 8px;
        }

        .fav-title {
            font-weight: bold;
            color: #003366;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fav-desc {
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
        }

        .btn-share {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 9px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        /* Selected Location Action Panel */
        #info-panel {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        #info-panel h3 {
            font-size: 0.95rem;
            color: #003366;
            margin-bottom: 4px;
        }

        #info-panel p {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .btn-save-fav {
            width: 100%;
            background: #ff9900;
            color: white;
            border: none;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
        }

        .btn-waze { background-color: #33ccff; color: #000; }
        .btn-gmaps { background-color: #4285F4; }

        .star-marker-icon {
            font-size: 26px;
            line-height: 26px;
            text-align: center;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
            cursor: pointer;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 480px) {
            #main-panel {
                top: 60px;
                left: 10px;
                right: 10px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏠 Malaysia House Locator</h1>
        <div class="sync-badge">🔴 Live Sync Active</div>
    </header>

    <div id="main-panel">
        <!-- Live Sync Group Input -->
        <div class="sync-box">
            <label>Sync ID:</label>
            <input type="text" id="sync-id-input" value="MY-HOUSES-1" onchange="changeSyncGroup(this.value)" />
            <button class="btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="changeSyncGroup(document.getElementById('sync-id-input').value)">Join</button>
        </div>

        <!-- Tab Controls -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('search')">🔍 Search</button>
            <button class="tab-btn" onclick="switchTab('favorites')">⭐ Live Stars (<span id="fav-count">0</span>)</button>
        </div>

        <!-- Tab 1: Search -->
        <div id="tab-search" class="tab-content active">
            <div class="search-box">
                <input type="text" id="address-input" style="flex:1;" placeholder="Search address, city, postcode..." />
                <button class="btn-primary" onclick="searchLocation()">Search</button>
            </div>
            <ul id="results-list" class="list-container"></ul>
        </div>

        <!-- Tab 2: Favorites Library -->
        <div id="tab-favorites" class="tab-content">
            <button class="btn-share" onclick="shareLiveSyncLink()">🔗 Share Live Sync Link</button>
            <ul id="favorites-list" class="list-container" style="max-height: 200px;"></ul>
        </div>

        <!-- Selected Location & Nav Actions -->
        <div id="info-panel">
            <h3 id="loc-title">Selected Location</h3>
            <p id="loc-address">Address details will appear here.</p>
            
            <button class="btn-save-fav" onclick="saveCurrentToFavorites()">⭐ Save & Sync To Live Map</button>

            <div class="nav-buttons">
                <a id="btn-gmaps" class="nav-btn btn-gmaps" target="_blank">Google Maps</a>
                <a id="btn-waze" class="nav-btn btn-waze" target="_blank">Waze</a>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase Realtime Database SDK for Live Synchronization -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. Initialize Firebase Cloud Database for Realtime Syncing
        const firebaseConfig = {
            databaseURL: "https://my-house-locator-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Initialize Leaflet Map over Malaysia
        const map = L.map('map').setView([4.2105, 108.9758], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let searchMarker = null;
        let activeSelectedData = null; 
        let favoriteMarkersOnMap = [];
        let favorites = [];
        let currentSyncId = "MY-HOUSES-1";

        const starIcon = L.divIcon({
            className: 'star-marker-icon',
            html: '⭐',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        // 3. Connect to Sync ID from URL hash or default
        const hashMatch = window.location.hash.match(/sync=([A-Za-z0-9_-]+)/);
        if (hashMatch && hashMatch[1]) {
            currentSyncId = hashMatch[1].toUpperCase();
        }
        document.getElementById('sync-id-input').value = currentSyncId;

        // Listen for live updates from Cloud
        connectToLiveSyncGroup(currentSyncId);

        function connectToLiveSyncGroup(syncId) {
            currentSyncId = syncId.trim().toUpperCase() || "MY-HOUSES-1";
            
            // Unsubscribe previous listener if any
            db.ref('sync_groups/' + currentSyncId).off();

            // Subscribe to live Realtime updates
            db.ref('sync_groups/' + currentSyncId).on('value', (snapshot) => {
                const data = snapshot.val();
                favorites = data ? Object.values(data) : [];
                renderFavorites();
            });
        }

        function changeSyncGroup(newSyncId) {
            if (!newSyncId.trim()) return;
            connectToLiveSyncGroup(newSyncId);
            window.location.hash = `sync=${currentSyncId}`;
            alert(`Connected to Live Sync Group: "${currentSyncId}"`);
        }

        function pushToCloud() {
            // Save favorites array to Firebase Cloud
            db.ref('sync_groups/' + currentSyncId).set(favorites);
        }

        // Switch Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'search') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-search').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-favorites').classList.add('active');
            }
        }

        // Search Location (Restricted to Malaysia)
        async function searchLocation() {
            const query = document.getElementById('address-input').value.trim();
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            if (!query) return;

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=5`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    resultsList.innerHTML = '<li style="color:red;">No location found in Malaysia.</li>';
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="fav-desc">${item.display_name}</span>`;
                    li.onclick = () => selectLocation(item.lat, item.lon, item.display_name);
                    resultsList.appendChild(li);
                });
            } catch (error) {
                alert("Failed to search location.");
            }
        }

        document.getElementById('address-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchLocation();
        });

        // Select Location
        function selectLocation(lat, lon, displayName, customTitle = null) {
            const latitude = parseFloat(lat);
            const longitude = parseFloat(lon);

            activeSelectedData = { lat: latitude, lon: longitude, address: displayName };

            map.flyTo([latitude, longitude], 16);

            if (searchMarker) {
                searchMarker.setLatLng([latitude, longitude]);
            } else {
                searchMarker = L.marker([latitude, longitude]).addTo(map);
            }

            document.getElementById('loc-title').innerText = customTitle ? `📍 ${customTitle}` : 'Selected Location';
            document.getElementById('loc-address').innerText = displayName;
            document.getElementById('info-panel').style.display = 'block';

            document.getElementById('btn-gmaps').href = `https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;
            document.getElementById('btn-waze').href = `https://waze.com/ul?ll=${latitude},${longitude}&navigate=yes`;

            document.getElementById('results-list').innerHTML = '';
        }

        // Map Click
        map.on('click', async function(e) {
            const { lat, lng } = e.latlng;
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const address = data.display_name || `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
                selectLocation(lat, lng, address);
            } catch (err) {
                selectLocation(lat, lng, `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`);
            }
        });

        // Save Current Location -> Push to Cloud Sync
        function saveCurrentToFavorites() {
            if (!activeSelectedData) return;

            const name = prompt("Enter a label for this location:\n(e.g., My House, Mom's House, Sabah Office)", "My Saved Place");
            if (!name || name.trim() === '') return;

            const newFav = {
                id: Date.now(),
                name: name.trim(),
                lat: activeSelectedData.lat,
                lon: activeSelectedData.lon,
                address: activeSelectedData.address
            };

            favorites.push(newFav);
            pushToCloud(); // Syncs to all connected devices in real time!
            alert(`Saved "${name}" and synced to all devices! ⭐`);
        }

        // Render Favorites & Stars on Map
        function renderFavorites() {
            const list = document.getElementById('favorites-list');
            document.getElementById('fav-count').innerText = favorites.length;
            list.innerHTML = '';

            favoriteMarkersOnMap.forEach(marker => map.removeLayer(marker));
            favoriteMarkersOnMap = [];

            if (favorites.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size: 0.8rem; text-align:center;">No synced places yet.<br>Select a location and save it!</li>';
                return;
            }

            favorites.forEach(fav => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="fav-info" onclick="selectLocation(${fav.lat}, ${fav.lon}, '${escapeQuotes(fav.address)}', '${escapeQuotes(fav.name)}')">
                        <span class="fav-title">⭐ ${fav.name}</span>
                        <span class="fav-desc">${fav.address}</span>
                    </div>
                    <button class="btn-delete" title="Delete Favorite" onclick="deleteFavorite(${fav.id}, event)">🗑️</button>
                `;
                list.appendChild(li);

                const starMarker = L.marker([fav.lat, fav.lon], { icon: starIcon }).addTo(map);
                starMarker.on('click', () => {
                    selectLocation(fav.lat, fav.lon, fav.address, fav.name);
                });

                favoriteMarkersOnMap.push(starMarker);
            });
        }

        // Share Link with Sync Code embedded
        function shareLiveSyncLink() {
            const shareableUrl = `${window.location.origin}${window.location.pathname}#sync=${currentSyncId}`;

            navigator.clipboard.writeText(shareableUrl).then(() => {
                alert(`🔗 Live Sync Link copied to clipboard!\n\nSync ID: "${currentSyncId}"\n\nAnyone opening this link stays synchronized with you in real-time!`);
            }).catch(() => {
                prompt("Copy this Live Sync Link:", shareableUrl);
            });
        }

        // Delete Favorite -> Push update to Cloud
        function deleteFavorite(id, event) {
            event.stopPropagation();
            if (confirm("Delete this star location?")) {
                favorites = favorites.filter(fav => fav.id !== id);
                pushToCloud(); // Syncs deletion to all devices in real time!
            }
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
