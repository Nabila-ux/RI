<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia House Locator (Peninsular, Sabah & Sarawak)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Header Bar */
        header {
            background: #003366;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Floating Search Panel */
        #search-panel {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 320px;
            max-width: 90vw;
        }

        .search-box {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #003366;
        }

        button.search-btn {
            background: #003366;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        button.search-btn:hover {
            background: #002244;
        }

        /* Search Results List */
        #results-list {
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 8px;
            border-top: 1px solid #eee;
        }

        #results-list li {
            padding: 8px 5px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 0.85rem;
            color: #333;
        }

        #results-list li:hover {
            background-color: #f0f7ff;
            color: #003366;
        }

        /* Selected Location Details */
        #info-panel {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        #info-panel h3 {
            font-size: 0.95rem;
            color: #003366;
            margin-bottom: 6px;
        }

        #info-panel p {
            font-size: 0.82rem;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
        }

        .btn-waze { background-color: #33ccff; color: #000; }
        .btn-gmaps { background-color: #4285F4; }
        .nav-btn:hover { opacity: 0.9; }

        /* Map styling */
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            #search-panel {
                top: 65px;
                left: 10px;
                right: 10px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏠 Malaysia Location Finder</h1>
        <span style="font-size: 0.8rem; opacity: 0.8;">Peninsular • Sabah • Sarawak</span>
    </header>

    <div id="search-panel">
        <div class="search-box">
            <input type="text" id="address-input" placeholder="Enter house address, area, or postcode..." />
            <button class="search-btn" onclick="searchLocation()">Search</button>
        </div>
        
        <ul id="results-list"></ul>

        <div id="info-panel">
            <h3 id="loc-title">Selected Location</h3>
            <p id="loc-address">Address details will appear here.</p>
            
            <div class="nav-buttons">
                <a id="btn-gmaps" class="nav-btn btn-gmaps" target="_blank">Google Maps</a>
                <a id="btn-waze" class="nav-btn btn-waze" target="_blank">Waze</a>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize map centered over Malaysia (covering Peninsular, Sabah, & Sarawak)
        // Center: Lat 4.2105, Lng 108.9758 (Center of South China Sea between East & West Malaysia)
        const map = L.map('map').setView([4.2105, 108.9758], 6);

        // 2. Add OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentMarker = null;

        // 3. Search Function using OpenStreetMap Nominatim API (Restricted to Malaysia)
        async function searchLocation() {
            const query = document.getElementById('address-input').value.trim();
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            if (!query) return;

            // Notice 'countrycodes=my' -> strictly restricts search results to Malaysia
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=5`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    resultsList.innerHTML = '<li style="color:red;">No location found in Malaysia.</li>';
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement('li');
                    li.innerText = item.display_name;
                    li.onclick = () => selectLocation(item.lat, item.lon, item.display_name);
                    resultsList.appendChild(li);
                });
            } catch (error) {
                console.error("Error fetching location:", error);
                alert("Failed to search. Please check your internet connection.");
            }
        }

        // Enable pressing Enter in input field
        document.getElementById('address-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchLocation();
        });

        // 4. Handle Location Selection
        function selectLocation(lat, lon, displayName) {
            const latitude = parseFloat(lat);
            const longitude = parseFloat(lon);

            // Fly map to selected coordinates
            map.flyTo([latitude, longitude], 16);

            // Add or move marker
            if (currentMarker) {
                currentMarker.setLatLng([latitude, longitude]);
            } else {
                currentMarker = L.marker([latitude, longitude]).addTo(map);
            }

            // Update details panel
            document.getElementById('loc-address').innerText = displayName;
            document.getElementById('info-panel').style.display = 'block';

            // Generate direct Navigation links for Google Maps and Waze
            document.getElementById('btn-gmaps').href = `https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;
            document.getElementById('btn-waze').href = `https://waze.com/ul?ll=${latitude},${longitude}&navigate=yes`;

            // Clear search dropdown list after selection
            document.getElementById('results-list').innerHTML = '';
        }

        // 5. Allow user to click ANYWHERE on the map to place a pin (Reverse Geocoding)
        map.on('click', async function(e) {
            const { lat, lng } = e.latlng;

            // Fetch address from clicked coordinates
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const address = data.display_name || `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
                
                selectLocation(lat, lng, address);
            } catch (err) {
                selectLocation(lat, lng, `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`);
            }
        });
    </script>
</body>
</html>
