<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia House Locator - Instant WebSockets Sync</title>

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Header Bar */
        header {
            background: #003366;
            color: white;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .sync-badge {
            background: #e6a100;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .sync-badge.online {
            background: #28a745;
        }

        /* Floating Sidebar / Panel */
        #main-panel {
            position: absolute;
            top: 60px;
            left: 15px;
            z-index: 1000;
            background: white;
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 330px;
            max-width: 92vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        /* Sync Room Control Box */
        .sync-box {
            background: #f0f7ff;
            border: 1px solid #cce5ff;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .sync-box label {
            font-size: 0.75rem;
            color: #003366;
            font-weight: bold;
        }

        .sync-box input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #99ccff;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Tabs UI */
        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            background: none;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #003366;
            border-bottom-color: #003366;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        button.btn-primary {
            background: #003366;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Search Results & Favorites List */
        .list-container {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            border-top: 1px solid #eee;
        }

        .list-container li {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 0.85rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-container li:hover {
            background-color: #f0f7ff;
        }

        .fav-info {
            flex: 1;
            overflow: hidden;
            padding-right: 8px;
        }

        .fav-title {
            font-weight: bold;
            color: #003366;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fav-desc {
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
        }

        .btn-share {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 9px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        /* Selected Location Action Panel */
        #info-panel {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }

        #info-panel h3 {
            font-size: 0.95rem;
            color: #003366;
            margin-bottom: 4px;
        }

        #info-panel p {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .btn-save-fav {
            width: 100%;
            background: #ff9900;
            color: white;
            border: none;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
        }

        .btn-waze { background-color: #33ccff; color: #000; }
        .btn-gmaps { background-color: #4285F4; }

        .star-marker-icon {
            font-size: 26px;
            line-height: 26px;
            text-align: center;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
            cursor: pointer;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 480px) {
            #main-panel {
                top: 55px;
                left: 8px;
                right: 8px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏠 Malaysia House Locator</h1>
        <div class="sync-badge" id="status-indicator">🟡 Connecting...</div>
    </header>

    <div id="main-panel">
        <!-- Live Sync Room Box -->
        <div class="sync-box">
            <label>Sync Room:</label>
            <input type="text" id="sync-id-input" value="SABAH-KL-ROOM1" />
            <button class="btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="joinSyncRoom(document.getElementById('sync-id-input').value)">Join</button>
        </div>

        <!-- Tab Controls -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('search')">🔍 Search</button>
            <button class="tab-btn" onclick="switchTab('favorites')">⭐ Live Stars (<span id="fav-count">0</span>)</button>
        </div>

        <!-- Tab 1: Search -->
        <div id="tab-search" class="tab-content active">
            <div class="search-box">
                <input type="text" id="address-input" style="flex:1;" placeholder="Search address, city, postcode..." />
                <button class="btn-primary" onclick="searchLocation()">Search</button>
            </div>
            <ul id="results-list" class="list-container"></ul>
        </div>

        <!-- Tab 2: Favorites Library -->
        <div id="tab-favorites" class="tab-content">
            <button class="btn-share" onclick="shareLiveSyncLink()">🔗 Share Room Link with Other Devices</button>
            <ul id="favorites-list" class="list-container" style="max-height: 220px;"></ul>
        </div>

        <!-- Selected Location & Nav Actions -->
        <div id="info-panel">
            <h3 id="loc-title">Selected Location</h3>
            <p id="loc-address">Address details will appear here.</p>
            
            <button class="btn-save-fav" onclick="saveCurrentToFavorites()">⭐ Save & Sync To Live Map</button>

            <div class="nav-buttons">
                <a id="btn-gmaps" class="nav-btn btn-gmaps" target="_blank">Google Maps</a>
                <a id="btn-waze" class="nav-btn btn-waze" target="_blank">Waze</a>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Paho MQTT WebSockets Engine for Realtime WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <script>
        // 1. Initialize Map centered over Malaysia (Peninsular + East Malaysia)
        const map = L.map('map').setView([4.2105, 108.9758], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let searchMarker = null;
        let activeSelectedData = null; 
        let favoriteMarkersOnMap = [];
        let favorites = JSON.parse(localStorage.getItem('my_malaysia_favs')) || [];
        let currentRoom = "SABAH-KL-ROOM1";
        let mqttClient = null;

        const starIcon = L.divIcon({
            className: 'star-marker-icon',
            html: '⭐',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        // 2. Check for Room ID in URL Hash (#sync=SABAH-KL-ROOM1)
        const hashMatch = window.location.hash.match(/sync=([A-Za-z0-9_-]+)/);
        if (hashMatch && hashMatch[1]) {
            currentRoom = hashMatch[1].toUpperCase();
        }
        document.getElementById('sync-id-input').value = currentRoom;

        // Render any locally cached favorites first
        renderFavorites();

        // 3. Connect to Global MQTT WebSockets Broker (EMQX Public SSL)
        initMqttConnection();

        function initMqttConnection() {
            const statusBadge = document.getElementById('status-indicator');
            statusBadge.innerText = '🟡 Connecting...';
            statusBadge.classList.remove('online');

            const clientId = "my_app_client_" + Math.random().toString(36).substring(2, 10);
            // Connect over WSS (WebSocket Secure) Port 8084
            mqttClient = new Paho.MQTT.Client("broker.emqx.io", 8084, clientId);

            mqttClient.onConnectionLost = onConnectionLost;
            mqttClient.onMessageArrived = onMessageArrived;

            mqttClient.connect({
                useSSL: true,
                cleanSession: false,
                timeout: 10,
                keepAliveInterval: 30,
                onSuccess: onConnectSuccess,
                onFailure: onConnectFailure
            });
        }

        function onConnectSuccess() {
            const statusBadge = document.getElementById('status-indicator');
            statusBadge.innerText = '🟢 Live Synced';
            statusBadge.classList.add('online');

            // Subscribe to topic channel for current Sync Room
            const topic = "malaysia_house_sync_2026/" + currentRoom;
            mqttClient.subscribe(topic, { qos: 1 });
            console.log("Subscribed to MQTT Topic: " + topic);
        }

        function onConnectFailure(err) {
            console.error("MQTT Connect Failed:", err);
            const statusBadge = document.getElementById('status-indicator');
            statusBadge.innerText = '🔴 Reconnecting...';
            statusBadge.classList.remove('online');
            setTimeout(initMqttConnection, 4000); // Retry connection
        }

        function onConnectionLost(responseObject) {
            console.warn("Connection lost:", responseObject.errorMessage);
            const statusBadge = document.getElementById('status-indicator');
            statusBadge.innerText = '🔴 Reconnecting...';
            statusBadge.classList.remove('online');
            setTimeout(initMqttConnection, 3000);
        }

        // 4. Realtime Message Received from another device!
        function onMessageArrived(message) {
            try {
                const incomingData = JSON.parse(message.payloadString);
                if (Array.isArray(incomingData)) {
                    favorites = incomingData;
                    localStorage.setItem('my_malaysia_favs', JSON.stringify(favorites));
                    renderFavorites();
                }
            } catch (e) {
                console.error("Failed to parse incoming payload", e);
            }
        }

        // 5. Broadcast Favorites to Cloud WebSockets
        function broadcastFavoritesToCloud() {
            if (!mqttClient || !mqttClient.isConnected()) {
                console.warn("MQTT not connected yet, saving locally.");
                return;
            }

            const topic = "malaysia_house_sync_2026/" + currentRoom;
            const payload = JSON.stringify(favorites);

            const message = new Paho.MQTT.Message(payload);
            message.destinationName = topic;
            message.qos = 1;
            message.retained = true; // Retains message so newly opening devices get it immediately!

            mqttClient.send(message);
        }

        // Change Sync Room Group
        function joinSyncRoom(newRoomId) {
            if (!newRoomId || !newRoomId.trim()) return;
            currentRoom = newRoomId.trim().toUpperCase();
            document.getElementById('sync-id-input').value = currentRoom;
            window.location.hash = `sync=${currentRoom}`;

            if (mqttClient && mqttClient.isConnected()) {
                initMqttConnection(); // Re-connect & subscribe to new topic room
            }
            alert(`Joined Sync Room: "${currentRoom}"`);
        }

        // Switch Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'search') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-search').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-favorites').classList.add('active');
            }
        }

        // Search Address in Malaysia
        async function searchLocation() {
            const query = document.getElementById('address-input').value.trim();
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            if (!query) return;

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&limit=5`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    resultsList.innerHTML = '<li style="color:red;">No location found in Malaysia.</li>';
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="fav-desc">${item.display_name}</span>`;
                    li.onclick = () => selectLocation(item.lat, item.lon, item.display_name);
                    resultsList.appendChild(li);
                });
            } catch (error) {
                alert("Search failed. Please check internet connection.");
            }
        }

        document.getElementById('address-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchLocation();
        });

        // Select Location
        function selectLocation(lat, lon, displayName, customTitle = null) {
            const latitude = parseFloat(lat);
            const longitude = parseFloat(lon);

            activeSelectedData = { lat: latitude, lon: longitude, address: displayName };

            map.flyTo([latitude, longitude], 16);

            if (searchMarker) {
                searchMarker.setLatLng([latitude, longitude]);
            } else {
                searchMarker = L.marker([latitude, longitude]).addTo(map);
            }

            document.getElementById('loc-title').innerText = customTitle ? `📍 ${customTitle}` : 'Selected Location';
            document.getElementById('loc-address').innerText = displayName;
            document.getElementById('info-panel').style.display = 'block';

            document.getElementById('btn-gmaps').href = `https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;
            document.getElementById('btn-waze').href = `https://waze.com/ul?ll=${latitude},${longitude}&navigate=yes`;

            document.getElementById('results-list').innerHTML = '';
        }

        // Map Click
        map.on('click', async function(e) {
            const { lat, lng } = e.latlng;
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const address = data.display_name || `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
                selectLocation(lat, lng, address);
            } catch (err) {
                selectLocation(lat, lng, `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`);
            }
        });

        // Save Current Location -> Broadcast via WebSockets
        function saveCurrentToFavorites() {
            if (!activeSelectedData) return;

            const name = prompt("Enter a label for this location:\n(e.g., My House, Mom's House, Sabah Office)", "My Saved Place");
            if (!name || name.trim() === '') return;

            const newFav = {
                id: Date.now(),
                name: name.trim(),
                lat: activeSelectedData.lat,
                lon: activeSelectedData.lon,
                address: activeSelectedData.address
            };

            favorites.push(newFav);
            localStorage.setItem('my_malaysia_favs', JSON.stringify(favorites));
            renderFavorites();

            // Broadcast real-time update to all connected devices!
            broadcastFavoritesToCloud();
            alert(`Saved "${name}" and broadcasted to all devices! ⭐`);
        }

        // Render Favorites List & Star Markers
        function renderFavorites() {
            const list = document.getElementById('favorites-list');
            document.getElementById('fav-count').innerText = favorites.length;
            list.innerHTML = '';

            favoriteMarkersOnMap.forEach(marker => map.removeLayer(marker));
            favoriteMarkersOnMap = [];

            if (favorites.length === 0) {
                list.innerHTML = '<li style="color:#888; font-size: 0.8rem; text-align:center;">No synced places yet.<br>Select a location and save it!</li>';
                return;
            }

            favorites.forEach(fav => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="fav-info" onclick="selectLocation(${fav.lat}, ${fav.lon}, '${escapeQuotes(fav.address)}', '${escapeQuotes(fav.name)}')">
                        <span class="fav-title">⭐ ${fav.name}</span>
                        <span class="fav-desc">${fav.address}</span>
                    </div>
                    <button class="btn-delete" title="Delete Favorite" onclick="deleteFavorite(${fav.id}, event)">🗑️</button>
                `;
                list.appendChild(li);

                const starMarker = L.marker([fav.lat, fav.lon], { icon: starIcon }).addTo(map);
                starMarker.on('click', () => {
                    selectLocation(fav.lat, fav.lon, fav.address, fav.name);
                });

                favoriteMarkersOnMap.push(starMarker);
            });
        }

        // Share Sync Link
        function shareLiveSyncLink() {
            const shareableUrl = `${window.location.origin}${window.location.pathname}#sync=${currentRoom}`;

            navigator.clipboard.writeText(shareableUrl).then(() => {
                alert(`🔗 Room Link copied!\n\nRoom ID: "${currentRoom}"\n\nSend this link to your other device. Once opened, whatever you add or delete will update on both screens instantly!`);
            }).catch(() => {
                prompt("Copy this Live Sync Link:", shareableUrl);
            });
        }

        // Delete Favorite
        function deleteFavorite(id, event) {
            event.stopPropagation();
            if (confirm("Delete this star location?")) {
                favorites = favorites.filter(fav => fav.id !== id);
                localStorage.setItem('my_malaysia_favs', JSON.stringify(favorites));
                renderFavorites();
                broadcastFavoritesToCloud(); // Sync deletion across devices
            }
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
